<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>111 Partners OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f8f9fb;--bg3:#f1f3f7;
  --border:#e5e7eb;--border2:#d1d5db;
  --ink:#111827;--ink2:#374151;--sub:#6b7280;--mute:#9ca3af;
  --blue:#3b82f6;--blue2:#2563eb;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
  --green:#10b981;--green-bg:#ecfdf5;
  --yellow:#f59e0b;--yellow-bg:#fffbeb;
  --red:#ef4444;--red-bg:#fef2f2;
  --purple:#8b5cf6;--purple-bg:#f5f3ff;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow2:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05);
  --r:8px;--r2:12px;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
button{cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif}
input,select,textarea{font-family:'Inter',sans-serif}
a{color:inherit;text-decoration:none}

/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}
#sb{width:240px;min-width:240px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;flex-shrink:0;transition:width .2s,min-width .2s;overflow:hidden}
#sb.col{width:56px;min-width:56px}
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
#topbar{height:52px;min-height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--bg);flex-shrink:0;z-index:10}
#content{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg2)}

/* SIDEBAR */
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-name{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.sb-tag{font-size:10px;color:var(--mute);letter-spacing:.04em;margin-top:2px;font-family:'DM Mono',monospace}
#sb.col .sb-brand{padding:16px 0;text-align:center}
#sb.col .sb-tag{display:none}
.sb-nav{flex:1;padding:8px 8px;overflow-y:auto}
.sb-section{margin-bottom:4px}
.sb-section-label{font-size:9px;font-weight:600;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;padding:8px 8px 4px;display:block}
#sb.col .sb-section-label{display:none}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;color:var(--sub);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap;width:100%;text-align:left}
.sb-item:hover{background:var(--bg2);color:var(--ink)}
.sb-item.on{background:var(--blue-bg);color:var(--blue2)}
.sb-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
#sb.col .sb-item{justify-content:center;padding:8px 0}
#sb.col .sb-label{display:none}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.sb-version{font-size:10px;color:var(--mute);font-family:'DM Mono',monospace}
#sb.col .sb-footer{display:none}
.sv-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.sv-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}

/* TOPBAR */
.tb-left{display:flex;align-items:center;gap:12px}
.tb-toggle{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--sub);transition:all .12s;font-size:16px}
.tb-toggle:hover{background:var(--bg2);color:var(--ink)}
.tb-title{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:6px 12px;width:220px;transition:all .15s}
.tb-search:focus-within{border-color:var(--blue);background:var(--bg);box-shadow:0 0 0 3px var(--blue-bg)}
.tb-search input{border:none;background:none;outline:none;font-size:13px;color:var(--ink);width:100%}
.tb-search input::placeholder{color:var(--mute)}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-bg);border:2px solid var(--blue-border);color:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

/* PAGE */
.page{padding:28px 28px 80px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.03em;line-height:1.2}
.page-sub{font-size:13px;color:var(--sub);margin-top:4px}

/* CARDS */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:20px;box-shadow:var(--shadow)}
.card-sm{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.stat-val{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.04em;line-height:1}
.stat-sub{font-size:11px;color:var(--mute);margin-top:5px}
.stat-accent{border-left:3px solid var(--blue)}

/* GRIDS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.grid-auto{grid-template-columns:1fr}}

/* SECTION HEADER */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh h2{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.sh-sub{font-size:12px;color:var(--mute);margin-top:2px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;border:none;font-family:'Inter',sans-serif}
.btn:hover{opacity:.88}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--bg);color:var(--ink2);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg2)}
.btn-ghost{background:transparent;color:var(--sub);padding:6px 10px}
.btn-ghost:hover{background:var(--bg2);color:var(--ink)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500;letter-spacing:.01em}
.badge-blue{background:var(--blue-bg);color:var(--blue2);border:1px solid var(--blue-border)}
.badge-green{background:var(--green-bg);color:#059669;border:1px solid #a7f3d0}
.badge-yellow{background:var(--yellow-bg);color:#d97706;border:1px solid #fde68a}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid #fecaca}
.badge-purple{background:var(--purple-bg);color:var(--purple);border:1px solid #ddd6fe}
.badge-gray{background:var(--bg3);color:var(--sub);border:1px solid var(--border)}

/* TABLES */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 12px;color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--ink2)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--bg2)}
.tbl-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow)}

/* CLIENT CARDS */
.client-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:18px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.client-card:hover{border-color:var(--blue-border);box-shadow:var(--shadow2);transform:translateY(-1px)}
.client-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;margin-bottom:12px}
.client-name{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-bottom:3px}
.client-role{font-size:12px;color:var(--sub);margin-bottom:10px}

/* TABS */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tab-btn{padding:8px 14px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s;background:none;border-top:none;border-left:none;border-right:none}
.tab-btn:hover{color:var(--ink)}
.tab-btn.on{color:var(--blue2);border-bottom-color:var(--blue)}
.tab-panel{display:none}.tab-panel.on{display:block}

/* FORMS */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:5px}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--ink);padding:8px 12px;font-size:13px;outline:none;transition:border-color .12s;font-family:'Inter',sans-serif}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
select.form-input option{background:var(--bg)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:600;color:var(--ink)}
.modal-body{padding:22px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* PIPELINE */
.pipeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.pipeline-col{min-width:200px;flex-shrink:0}
.pipeline-header{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.pipeline-count{background:var(--bg3);color:var(--mute);border-radius:99px;padding:1px 7px;font-size:10px}
.pipeline-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .12s}
.pipeline-card:hover{border-color:var(--blue-border);box-shadow:var(--shadow)}

/* DETAIL VIEW */
.detail-header{background:var(--bg);border-bottom:1px solid var(--border);padding:22px 28px 0}
.detail-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer;margin-bottom:14px;width:fit-content}
.detail-back:hover{color:var(--blue)}
.detail-name{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.03em;margin-bottom:4px}
.detail-meta{font-size:13px;color:var(--sub);margin-bottom:16px}

/* PRIORITY TASK */
.task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-check{width:16px;height:16px;border:1.5px solid var(--border2);border-radius:4px;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.task-check.done{background:var(--green);border-color:var(--green)}
.task-title{font-size:13px;color:var(--ink2);flex:1;min-width:0}
.task-title.done{text-decoration:line-through;color:var(--mute)}
.task-due{font-size:11px;color:var(--mute);font-family:'DM Mono',monospace;white-space:nowrap}
.task-due.urgent{color:var(--red)}

/* FINANCIAL */
.fin-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.fin-row:last-child{border-bottom:none}
.fin-label{font-size:13px;color:var(--ink2)}
.fin-val{font-size:13px;font-weight:600;color:var(--ink);font-family:'DM Mono',monospace}
.fin-flag{font-size:10px;color:var(--yellow);margin-left:6px}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty-icon{font-size:28px;margin-bottom:10px;opacity:.4}
.empty-text{font-size:13px}

/* SONG TABLE */
.song-status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}

/* ACTIVITY */
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--blue-border);border:2px solid var(--blue);flex-shrink:0;margin-top:4px}
.activity-text{font-size:13px;color:var(--ink2);flex:1}
.activity-time{font-size:11px;color:var(--mute);font-family:'DM Mono',monospace;white-space:nowrap}

/* REPRESENTATION BADGES */
.rep-excl{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.rep-nonexcl{background:#fefce8;color:#a16207;border:1px solid #fde047}
.rep-strategic{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.rep-founder{background:#fdf4ff;color:#7e22ce;border:1px solid #e9d5ff}
.rep-advisor{background:#f8fafc;color:#475569;border:1px solid #cbd5e1}

/* 1DRM IMPRINT */
.imprint-header{background:linear-gradient(135deg,#0f0f17 0%,#1a1a2e 100%);border-radius:var(--r2);padding:28px;color:#fff;margin-bottom:20px}
.imprint-title{font-size:26px;font-weight:700;letter-spacing:-.03em;color:#fff}
.imprint-sub{font-size:13px;color:rgba(255,255,255,.5);margin-top:4px}
.imprint-nav{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.imprint-nav-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);transition:all .12s;font-family:Inter,sans-serif}
.imprint-nav-btn:hover,.imprint-nav-btn.on{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3)}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day-hd{font-size:10px;font-weight:600;color:var(--mute);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-cell{min-height:72px;padding:5px 6px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:border-color .12s}
.cal-cell:hover{border-color:var(--blue)}
.cal-cell.today{background:var(--blue-bg);border-color:var(--blue)}
.cal-num{font-size:12px;color:var(--sub);margin-bottom:3px}
.cal-cell.today .cal-num{color:var(--blue2);font-weight:700}
.cal-event{font-size:9px;background:var(--blue-bg);color:var(--blue2);padding:1px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-event.task{background:var(--red-bg);color:var(--red)}
.cal-event.venture{background:var(--purple-bg);color:var(--purple)}

/* DOCUMENT TREE */
.doc-client-section{margin-bottom:20px}
.doc-client-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-radius:8px;cursor:pointer;border:1px solid var(--border);margin-bottom:8px}
.doc-client-name{font-size:13px;font-weight:600;color:var(--ink);flex:1}
.doc-item{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);transition:background .1s}
.doc-item:hover{background:var(--bg2)}
.doc-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.doc-title{font-size:13px;color:var(--ink);flex:1}
.doc-cat{font-size:10px;color:var(--mute)}
.doc-open{font-size:11px;color:var(--blue2);text-decoration:none;border-bottom:1px solid var(--blue-border)}
.doc-open:hover{opacity:.7}

/* FINANCIAL INPUT */
.fin-input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;font-family:DM Mono,monospace;font-weight:600;color:var(--ink);width:140px;outline:none;transition:border-color .12s}
.fin-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.fin-status-needs{color:var(--yellow);background:var(--yellow-bg);border-color:#fde68a}
.fin-status-proposed{color:var(--sub);background:var(--bg3);border-color:var(--border2)}
.fin-status-agreed{color:var(--blue2);background:var(--blue-bg);border-color:var(--blue-border)}
.fin-status-invoiced{color:var(--purple);background:var(--purple-bg);border-color:#ddd6fe}
.fin-status-collected{color:var(--green);background:var(--green-bg);border-color:#a7f3d0}
.fin-status-overdue{color:var(--red);background:var(--red-bg);border-color:#fecaca}
.fin-summary-bar{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.fin-summary-cell{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.fin-summary-label{font-size:10px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fin-summary-val{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.03em;font-family:DM Mono,monospace}
.fin-summary-sub{font-size:10px;color:var(--mute);margin-top:3px}
.fin-tbl .fin-edit-btn{opacity:0;transition:opacity .12s}
.fin-tbl tr:hover .fin-edit-btn{opacity:1}

/* ── MOBILE / IPHONE ───────────────────────────────────────────────── */
#mobile-tab-bar { display: none; }
#mob-section-scroller { display: none; }

@media (max-width: 768px) {
  /* Hide sidebar on mobile */
  #sb { display: none !important; }
  #main { width: 100vw; }

  /* Topbar */
  #topbar {
    height: 54px;
    padding: 0 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #sb-toggle { display: none; }

  /* Content padding for tab bar */
  #content { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .page { padding: 16px 16px 100px; }

  /* Single column */
  .grid2, .grid3, .grid-auto { grid-template-columns: 1fr !important; }
  .stats-grid { grid-template-columns: 1fr 1fr !important; gap: 8px; }
  .fin-summary-bar { grid-template-columns: 1fr 1fr !important; gap: 8px; }
  .form-row, .form-row3 { grid-template-columns: 1fr !important; }

  /* Typography */
  .page-title { font-size: 19px; }
  .stat-val { font-size: 22px; }

  /* Cards */
  .card, .card-sm { padding: 14px; }

  /* Tables scroll */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tbl { min-width: 520px; }
  .fin-tbl .tbl { min-width: 860px; }

  /* Pipeline */
  .pipeline { gap: 8px; }
  .pipeline-col { min-width: 175px; }

  /* Modals slide up from bottom — native iOS feel */
  .modal-bg {
    padding: 0;
    align-items: flex-end;
  }
  .modal {
    border-radius: 18px 18px 0 0 !important;
    max-width: 100% !important;
    max-height: 92vh;
    border-bottom: none;
  }

  /* Tabs scroll */
  .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; flex-wrap: nowrap; }
  .tab-btn { flex-shrink: 0; }

  /* Detail */
  .detail-header { padding: 16px 16px 0; }
  .detail-name { font-size: 20px; }

  /* Imprint */

function statCard(label,val,sub,cls){
  return '<div class="stat '+(cls||'')+'"><div class="stat-label">'+label+'</div><div class="stat-val">'+val+'</div><div class="stat-sub">'+sub+'</div></div>';
}
function toggleTask(id){
  D.tasks=D.tasks.map(function(t){
    if(t.id!==id)return t;
    var next=t.status==='completed'?'todo':'completed';
    return Object.assign({},t,{status:next});
  });
  save();R();
}

function mEditTask(id){
  var t=D.tasks.find(function(x){return x.id===id;});
  if(!t)return;
  var statusOpts=['todo','in-progress','waiting','completed','cancelled'].map(function(s){
    return '<option value="'+s+'"'+(t.status===s?' selected':'')+'>'+s+'</option>';
  }).join('');
  modal('Edit Task',
    '<div class="form-group"><label class="form-label">Title</label><input class="form-input" id="et-title" value="'+esc(t.title)+'"/></div>'+
    '<div class="form-group"><label class="form-label">Description</label><textarea class="form-input" id="et-desc" style="height:60px">'+esc(t.description||'')+'</textarea></div>'+
    '<div class="form-row">'+
    '<div class="form-group"><label class="form-label">Status</label><select class="form-input" id="et-status">'+statusOpts+'</select></div>'+
    '<div class="form-group"><label class="form-label">Priority</label><select class="form-input" id="et-pri">'+
    ['high','medium','low'].map(function(p){return '<option value="'+p+'"'+(t.priority===p?' selected':'')+'>'+p+'</option>';}).join('')+
    '</select></div>'+
    '</div>'+
    '<div class="form-row">'+
    '<div class="form-group"><label class="form-label">Assignee</label><input class="form-input" id="et-assign" value="'+esc(t.assignee||'')+'"/></div>'+
    '<div class="form-group"><label class="form-label">Due Date</label><input type="date" class="form-input" id="et-due" value="'+esc(t.dueDate||'')+'"/></div>'+
    '</div>'+
    '<div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="et-notes" style="height:55px">'+esc(t.notes||'')+'</textarea></div>'+
    '<div class="modal-footer"><button class="btn btn-danger" id="del-task-btn">Delete</button><button class="btn btn-secondary" onclick="CM()">Cancel</button><button class="btn btn-primary" id="save-task-edit-btn">Save</button></div>');
  setTimeout(function(){
    var sb=document.getElementById('save-task-edit-btn');
    if(sb)sb.addEventListener('click',function(){
      D.tasks=D.tasks.map(function(x){
        if(x.id!==id)return x;
        return Object.assign({},x,{title:V('et-title'),description:V('et-desc'),status:V('et-status'),priority:V('et-pri'),assignee:V('et-assign'),dueDate:V('et-due'),notes:V('et-notes')});
      });
      logActivity('Updated task: '+V('et-title'),'task',id);
      upd({});CM();
    });
    var db=document.getElementById('del-task-btn');
    if(db)db.addEventListener('click',function(){
      if(confirm('Delete this task?')){
        D.tasks=D.tasks.filter(function(x){return x.id!==id;});
        logActivity('Deleted task','task',id);
        upd({});CM();
      }
    });
  },10);
}

// ── DEALS ─────────────────────────────────────────────────────────────
var DEAL_FILTER_CAT = 'all';
var DEAL_STAGES = ['Prospect','Discussion','Negotiating','Contract Out','Signed','Active','Completed','Dead'];

function allDeals(){
  // Merge legacy D.deals + D.generaldeals into unified list
  var legacy=(D.deals||[]).map(function(d){
    return {id:d.id,clientId:d.clientId,title:d.brand||(d.campaign||'Untitled'),
      type:d.dealType||'other',stage:d.stage||'Prospect',
      value:d.proposedFee||0,date:d.date||'',notes:d.notes||'',_src:'deals'};
  });
  var general=(D.generaldeals||[]).map(function(d){
    return {id:d.id,clientId:d.clientId,title:d.title||'Untitled',
      type:d.type||'other',stage:d.stage||'Prospect',
      value:d.value||0,date:d.date||'',notes:d.notes||'',_src:'generaldeals'};
  });
  return legacy.concat(general);
}

function rDeals(){
  var all=allDeals();
  var filtered=DEAL_FILTER_CAT==='all'?all:all.filter(function(d){
    var dt=dealTypeById(d.type);
    return dt.cat===DEAL_FILTER_CAT;
  });

  var total=filtered.reduce(function(s,d){return s+(parseFloat(d.value)||0);},0);

  var h='<div class="page-header"><div class="page-title">Deals</div><div class="page-sub">'+all.length+' deals across all categories'+(total?' &nbsp;·&nbsp; $'+total.toLocaleString()+' total value':'')+'</div></div>';

  // Category filter tabs
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center">';
  DEAL_CATEGORIES.forEach(function(cat){
    h+='<button class="btn btn-sm '+(DEAL_FILTER_CAT===cat.id?'btn-primary':'btn-secondary')+'" data-dcat="'+cat.id+'">'+cat.label+'</button>';
  });
  h+='<button class="btn btn-primary btn-sm" id="add-deal-btn" style="margin-left:auto">+ New Deal</button>';
  h+='</div>';

  // Pipeline board
  h+='<div class="pipeline">';
  DEAL_STAGES.forEach(function(stage){
    var items=filtered.filter(function(d){return (d.stage||'').toLowerCase()===stage.toLowerCase();});
    h+='<div class="pipeline-col"><div class="pipeline-header">'+esc(stage)+'<span class="pipeline-count">'+items.length+'</span></div>';
    items.forEach(function(d){
      var dt=dealTypeById(d.type);
      var cl=clientById(d.clientId);
      h+='<div class="pipeline-card" data-unified-deal="'+d.id+'" data-deal-src="'+d._src+'">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">'+
        '<span style="font-weight:600;font-size:13px">'+esc(d.title)+'</span>'+
        '<span class="badge '+dt.color+'" style="font-size:9px">'+esc(dt.label)+'</span>'+
        '</div>'+
        '<div style="font-size:11px;color:var(--sub)">'+esc(cl.name||'--')+'</div>'+
        (d.value?'<div style="font-size:11px;color:var(--mute);margin-top:4px">$'+parseFloat(d.value).toLocaleString()+'</div>':'')+'</div>';
    });
    h+='</div>';
  });
  h+='</div>';

  document.getElementById('screen').innerHTML=h;

  // Wire category filters
  document.getElementById('screen').querySelectorAll('[data-dcat]').forEach(function(btn){
    btn.addEventListener('click',function(){DEAL_FILTER_CAT=btn.getAttribute('data-dcat');rDeals();});
  });
  // Wire add button
  var ab=document.getElementById('add-deal-btn');
  if(ab)ab.addEventListener('click',function(){mAddDeal();});
  // Wire pipeline cards
  document.getElementById('screen').querySelectorAll('[data-unified-deal]').forEach(function(card){
    card.addEventListener('click',function(){
      mEditUnifiedDeal(card.getAttribute('data-unified-deal'),card.getAttribute('data-deal-src'));
    });
  });
}

function dealTypeById(id){return DEAL_TYPES.find(function(t){return t.id===id;})||{id:id,label:id,color:'badge-gray',cat:'business'};}

var DEAL_TYPE_LABELS = {};
var DEAL_TYPE_COLORS = {};
DEAL_TYPES.forEach(function(t){DEAL_TYPE_LABELS[t.id]=t.label;DEAL_TYPE_COLORS[t.id]=t.color;});

function finStatusClass(s){
  var m={'needs-verification':'fin-status-needs','proposed':'fin-status-proposed','agreed':'fin-status-agreed','invoiced':'fin-status-invoiced','collected':'fin-status-collected','overdue':'fin-status-overdue'};
  return m[s]||'fin-status-proposed';
}

function calc111Revenue(f){
  var amt=parseFloat(f.amount)||0;
  var rate=parseFloat(f.commissionRate)||0;
  if(f.dealType==='commission') return amt*(rate/100);
  if(f.dealType==='direct') return amt;
  if(f.dealType==='partnership') return parseFloat(f.revenue111)||0;
  if(f.dealType==='no-fee-strategic') return 0;
  if(f.dealType==='publishing') return parseFloat(f.revenue111)||0;
  return parseFloat(f.revenue111)||0;
}

function calcClientNet(f){
  var amt=parseFloat(f.amount)||0;
  var r111=calc111Revenue(f);
  if(f.dealType==='commission') return amt-r111;
  if(f.dealType==='direct') return 0;
  return amt-r111;
}

function calcFinSummary(records){
  var out={collected111:0,invoiced111:0,agreed111:0,proposed111:0,needsVerification:0,underCollection:0,partnershipStakes:0,noFee:0};
  records.forEach(function(f){
    var r111=calc111Revenue(f);
    var amt=parseFloat(f.amount)||0;
    if(f.dealType==='no-fee-strategic'){out.noFee++;return;}
    if(f.dealType==='partnership'){out.partnershipStakes+=r111;return;}
    if(f.status==='collected'){out.collected111+=r111;}
    else if(f.status==='invoiced'){out.invoiced111+=r111;}
    else if(f.status==='agreed'){out.agreed111+=r111;}
    else if(f.status==='proposed'){out.proposed111+=r111;}
    else if(f.status==='needs-verification'){out.needsVerification+=parseFloat(f.reportedAmount)||0;out.underCollection+=amt;}
  });
  return out;
}

function rTasks(){
  var h='<div class="page-header"><div class="page-title">All Tasks</div></div>';
  h+='<div style="margin-bottom:16px;display:flex;gap:8px"><button class="btn btn-primary" onclick="mAddTask()">+ Add Task</button></div>';
  h+='<div class="grid2">';
  var urgent=D.tasks.filter(function(t){return t.priority==='high'&&t.status!=='completed';});
  var other=D.tasks.filter(function(t){return t.priority!=='high'&&t.status!=='completed';});
  h+='<div class="card"><div class="sh"><h2>High Priority</h2><span class="badge badge-red">'+urgent.length+'</span></div>'+renderTaskList(urgent)+'</div>';
  h+='<div class="card"><div class="sh"><h2>Other Tasks</h2></div>'+renderTaskList(other)+'</div>';
  h+='</div>';
  document.getElementById('screen').innerHTML=h;
  wireTaskList(document.getElementById('screen'));
}

function renderTaskList(tasks){
  if(!tasks||!tasks.length)return '<div class="empty"><div class="empty-text">No tasks</div></div>';
  return tasks.map(function(t){
    var done=t.status==='completed';
    var dl=daysLeft(t.dueDate);
    var cl=clientById(t.clientId);
    return '<div class="task-row">'+
      '<div class="task-check'+(done?' done':'')+'" data-tid="'+t.id+'">'+(done?'✓':'')+'</div>'+
      '<div class="task-title'+(done?' done':'')+'">'+esc(t.title)+
        '<div style="font-size:11px;color:var(--mute);margin-top:2px">'+
          (cl.name?esc(cl.name)+' &nbsp;·&nbsp; ':'')+
          (done?'<span style="color:var(--green)">Completed</span>':esc(t.status||'todo'))+
        '</div>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">'+
      (t.dueDate&&!done?'<div class="task-due'+(dl!==null&&dl<=3?' urgent':'')+'">'+fmtDate(t.dueDate)+'</div>':'')+
      priorityBadge(t.priority)+
      '<button class="btn btn-ghost btn-xs" data-edit-tid="'+t.id+'" style="opacity:.5;font-size:11px">✎</button>'+
      (done?'<button class="btn btn-ghost btn-xs" data-undo-tid="'+t.id+'" style="opacity:.5;font-size:10px;color:var(--yellow)" title="Mark incomplete">↩</button>':'')+
      '</div>'+
      '</div>';
  }).join('');
}

function wireTaskList(container){
  if(!container)return;
  container.querySelectorAll('[data-tid]').forEach(function(el){
    el.addEventListener('click',function(){toggleTask(el.getAttribute('data-tid'));});
  });

// ── SIMPLE PAGES ─────────────────────────────────────────────────────
function rCalendar(){
  var now=new Date();
  var y=CAL_STATE.y||now.getFullYear();
  var m=CAL_STATE.m!==undefined?CAL_STATE.m:now.getMonth();
  var fd=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var days2=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Gather events from tasks + upcoming deadlines
  var events={};
  D.tasks.filter(function(t){return t.dueDate&&t.status!=='completed';}).forEach(function(t){
    var k=t.dueDate.slice(0,10);
    if(!events[k])events[k]=[];
    events[k].push({label:t.title,type:'task'});
  });

  var h='<div class="page-header"><div class="page-title">Calendar</div><div class="page-sub">'+months[m]+' '+y+'</div></div>';

  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">';
  h+='<div style="display:flex;gap:8px"><button class="btn btn-secondary btn-sm" onclick="CAL_STATE.m--;if(CAL_STATE.m<0){CAL_STATE.m=11;CAL_STATE.y--;}rCalendar()">← Prev</button><button class="btn btn-secondary btn-sm" onclick="CAL_STATE.m++;if(CAL_STATE.m>11){CAL_STATE.m=0;CAL_STATE.y++;}rCalendar()">Next →</button><button class="btn btn-ghost btn-sm" onclick="CAL_STATE.y=new Date().getFullYear();CAL_STATE.m=new Date().getMonth();rCalendar()">Today</button></div>';
  h+='<a href="https://calendar.google.com/calendar/r?cid='+encodeURIComponent(CAL_ID)+'" target="_blank" class="btn btn-secondary btn-sm">Open Google Calendar ↗</a>';
  h+='</div>';

  h+='<div class="card"><div class="cal-grid" style="margin-bottom:6px">';
  days2.forEach(function(d){h+='<div class="cal-day-hd">'+d+'</div>';});
  h+='</div><div class="cal-grid">';

  for(var i=0;i<fd;i++)h+='<div></div>';
  for(var d=1;d<=dim;d++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var ev=events[ds]||[];
    var isToday=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===d;
    h+='<div class="cal-cell'+(isToday?' today':'')+'" data-ds="'+ds+'">';
    h+='<div class="cal-num">'+d+'</div>';
    ev.slice(0,2).forEach(function(e){h+='<div class="cal-event '+e.type+'">'+esc(e.label.slice(0,18))+'</div>';});
    if(ev.length>2)h+='<div style="font-size:9px;color:var(--mute)">+'+( ev.length-2)+' more</div>';
    h+='</div>';
  }
  h+='</div></div>';

  // Upcoming tasks list
  h+='<div class="card" style="margin-top:16px"><div class="sh"><h2>Upcoming Deadlines</h2><button class="btn btn-primary btn-sm" onclick="pushAllToCalendar()">Sync to Google Calendar</button></div>';
  var upcoming=D.tasks.filter(function(t){return t.dueDate&&t.status!=='completed'&&new Date(t.dueDate)>=new Date();}).sort(function(a,b){return a.dueDate.localeCompare(b.dueDate);}).slice(0,10);
  h+=renderTaskList(upcoming);
  h+='</div>';

  document.getElementById('screen').innerHTML=h;
  wireTaskList(document.getElementById('screen'));
  document.getElementById('screen').querySelectorAll('[data-ds]').forEach(function(el){el.addEventListener('click',function(){showCalDay(el.getAttribute('data-ds'));});});
}

var CAL_STATE={y:new Date().getFullYear(),m:new Date().getMonth()};

function showCalDay(ds){
  var ev=D.tasks.filter(function(t){return t.dueDate===ds;});
  modal(new Date(ds).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}),
    (ev.length?ev.map(function(t){return '<div class="card-sm" style="margin-bottom:8px"><div style="font-weight:600;margin-bottom:4px">'+esc(t.title)+'</div><div style="font-size:12px;color:var(--sub)">'+esc(clientById(t.clientId).name||'')+'</div>'+priorityBadge(t.priority)+'</div>';}).join(''):

function pushAllToCalendar(){
  var tasks=D.tasks.filter(function(t){return t.dueDate&&t.status!=='completed';});
  fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'syncCalendar',tasks:tasks,calId:CAL_ID})}).catch(function(){});
  alert('Syncing '+tasks.length+' tasks to Google Calendar. Events will appear shortly.');
}

// ── TABS HELPER ──────────────────────────────────────────────────────
function wireTabs(containerId){
  var container=document.getElementById(containerId);
  if(!container)return;
  container.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      container.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      var tab=btn.getAttribute('data-tab');
      document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('on');});
      var panel=document.getElementById(tab);
      if(panel)panel.classList.add('on');
    });
  });
}

  D.songs.forEach(function(s){if(s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q))results.push({type:'Song',name:s.title+'  --  '+s.artist,page:'producers'});});
  D.albums.forEach(function(a){if((a.title||'').toLowerCase().includes(q)||(a.artist||'').toLowerCase().includes(q))results.push({type:'Album',name:a.title,page:'producers'});});
  D.ventures.forEach(function(v){if(v.name.toLowerCase().includes(q))results.push({type:'Venture',name:v.name,page:'ventures'});});
  D.tasks.forEach(function(t){if(t.title.toLowerCase().includes(q))results.push({type:'Task',name:t.title,page:'tasks'});});
  if(results.length){
    var h='<div style="position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow2);z-index:100;max-height:280px;overflow-y:auto;margin-top:4px">';
    h+=results.slice(0,8).map(function(r){return '<div style="padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center" onclick="go(\''+r.page+'\')"><span class="badge badge-gray" style="font-size:10px">'+esc(r.type)+'</span><span style="font-size:13px">'+esc(r.name)+'</span></div>';}).join('');
    h+='</div>';
    var wrap=this.closest('.tb-search');
    wrap.style.position='relative';
    var existing=wrap.querySelector('[data-search-results]');
    if(existing)existing.remove();
    var el=document.createElement('div');el.setAttribute('data-search-results','1');el.innerHTML=h;
    wrap.appendChild(el);
  }
});
document.addEventListener('click',function(e){if(!e.target.closest('.tb-search'))document.querySelectorAll('[data-search-results]').forEach(function(el){el.remove();});});

// ── TALENT PROFILES (flexible data input) ────────────────────────────
// Each talent (client) has: notes, fields (custom key/value), links

function mTalentProfile(clientId){
  var cl=D.clients.find(function(c){return c.id===clientId;});
  if(!cl)return;
  var fields=cl.fields||[];
  var links=cl.links||[];

  var fieldsHtml=fields.map(function(f,i){
    return '<div style="display:flex;gap:8px;margin-bottom:6px">'+
      '<input class="form-input" style="flex:.8" value="'+esc(f.label)+'" placeholder="Label" data-findex="'+i+'" data-ftype="label"/>'+
      '<input class="form-input" style="flex:1.2" value="'+esc(f.value)+'" placeholder="Value" data-findex="'+i+'" data-ftype="value"/>'+
      '<button class="btn btn-danger btn-xs" data-del-field="'+i+'">✕</button>'+
      '</div>';
  }).join('');

  var linksHtml=links.map(function(l,i){
    return '<div style="display:flex;gap:8px;margin-bottom:6px">'+
      '<input class="form-input" style="flex:.7" value="'+esc(l.label)+'" placeholder="Label (e.g. Instagram)" data-lindex="'+i+'" data-ltype="label"/>'+
      '<input class="form-input" style="flex:1.3" value="'+esc(l.url)+'" placeholder="https://..." data-lindex="'+i+'" data-ltype="url"/>'+
      '<button class="btn btn-danger btn-xs" data-del-link="'+i+'">✕</button>'+
      '</div>';
  }).join('');

  modal('Profile: '+cl.name,
    '<div class="form-group"><label class="form-label">Notes</label>'+
    '<textarea class="form-input" id="talent-notes" style="height:90px" placeholder="Strategy, context, anything relevant...">'+esc(cl.notes||'')+'</textarea></div>'+

    '<div class="form-group"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
    '<label class="form-label" style="margin:0">Custom Fields</label>'+
    '<button class="btn btn-secondary btn-xs" id="add-field-btn">+ Field</button></div>'+
    '<div id="fields-list">'+fieldsHtml+'</div></div>'+

    '<div class="form-group"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
    '<label class="form-label" style="margin:0">Links</label>'+
    '<button class="btn btn-secondary btn-xs" id="add-link-btn">+ Link</button></div>'+
    '<div id="links-list">'+linksHtml+'</div></div>'+

    '<div class="modal-footer"><button class="btn btn-secondary" onclick="CM()">Cancel</button><button class="btn btn-primary" id="save-talent-btn">Save Profile</button></div>',
    600);

  setTimeout(function(){
    // Add field
    var afb=document.getElementById('add-field-btn');
    if(afb)afb.addEventListener('click',function(){
      var fl=document.getElementById('fields-list');
      var idx2=fl.children.length;
      var div=document.createElement('div');
      div.style.cssText='display:flex;gap:8px;margin-bottom:6px';
      div.innerHTML='<input class="form-input" style="flex:.8" placeholder="Label" data-findex="'+idx2+'" data-ftype="label"/>'+
        '<input class="form-input" style="flex:1.2" placeholder="Value" data-findex="'+idx2+'" data-ftype="value"/>'+
        '<button class="btn btn-danger btn-xs" data-del-field="'+idx2+'">✕</button>';
      fl.appendChild(div);
      wireDeleteBtns();
    });
    // Add link
    var alb=document.getElementById('add-link-btn');
    if(alb)alb.addEventListener('click',function(){
      var ll=document.getElementById('links-list');
      var idx2=ll.children.length;
      var div=document.createElement('div');
      div.style.cssText='display:flex;gap:8px;margin-bottom:6px';
      div.innerHTML='<input class="form-input" style="flex:.7" placeholder="Label (e.g. Instagram)" data-lindex="'+idx2+'" data-ltype="label"/>'+
        '<input class="form-input" style="flex:1.3" placeholder="https://..." data-lindex="'+idx2+'" data-ltype="url"/>'+
        '<button class="btn btn-danger btn-xs" data-del-link="'+idx2+'">✕</button>';
      ll.appendChild(div);
      wireDeleteBtns();
    });
    // Wire delete
    function wireDeleteBtns(){
      document.querySelectorAll('[data-del-field]').forEach(function(b){
        b.onclick=function(){b.closest('div').remove();};
      });
      document.querySelectorAll('[data-del-link]').forEach(function(b){
        b.onclick=function(){b.closest('div').remove();};
      });
    }
    wireDeleteBtns();
    // Save
    var sb=document.getElementById('save-talent-btn');
    if(sb)sb.addEventListener('click',function(){
      // Collect fields
      var newFields=[];
      document.getElementById('fields-list').querySelectorAll('div').forEach(function(row){
        var label=row.querySelector('[data-ftype="label"]');
        var value=row.querySelector('[data-ftype="value"]');
        if(label&&value&&(label.value||value.value)){
          newFields.push({label:label.value,value:value.value});
        }
      });
      // Collect links
      var newLinks=[];
      document.getElementById('links-list').querySelectorAll('div').forEach(function(row){
        var label=row.querySelector('[data-ltype="label"]');
        var url=row.querySelector('[data-ltype="url"]');
        if(label&&url&&(label.value||url.value)){
          newLinks.push({label:label.value,url:url.value});
        }
      });
      D.clients=D.clients.map(function(c){
        if(c.id!==clientId)return c;
        return Object.assign({},c,{notes:V('talent-notes'),fields:newFields,links:newLinks});
      });
      logActivity('Updated profile: '+cl.name,'client',clientId);
      upd({});CM();
    });
  },10);
}

function isMobile(){return window.innerWidth<=768;}

document.querySelectorAll('[data-mob-tab]').forEach(function(btn){

    } else {

    }

});

// Sync mobile tab highlight with nav
var _origGo2=go;
go=function(p,extra){
  _origGo2(p,extra);
  var tabMap={
    dashboard:'dashboard',
    tasks:'tasks',calendar:'tasks',documents:'tasks',contacts:'tasks',activity:'tasks',settings:'tasks',
    artists:'talent',producers:'talent',creators:'talent',filmtv:'talent',

    {label:'Film & TV',page:'filmtv',icon:'◉',count:D.filmtv.length,color:'#f97316'},
    {label:'1DRM Imprint',page:'1drm',icon:'◈',count:0,color:'#1a1a2e'},

  ];
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">';

      '<div style="font-size:26px;margin-bottom:8px;color:'+c.color+'">'+c.icon+'</div>'+

  if(urgent.length){
    h+='<div class="card"><div class="sh"><h2>Priority Actions</h2><span class="badge badge-red">'+urgent.length+'</span></div>';
    h+=renderTaskList(urgent.slice(0,5));
    h+='</div>';
  }
  document.getElementById('screen').innerHTML=h;
  document.getElementById('screen').querySelectorAll('[data-cat-page]').forEach(function(el){

  document.getElementById('screen').querySelectorAll('[data-tid]').forEach(function(el){
    el.addEventListener('click',function(){toggleTask(el.getAttribute('data-tid'));});
  });
  document.getElementById('content').scrollTop=0;
}

// ── MOBILE HORIZONTAL SCROLL NAV (PILLS) ──────────────────────────────
function syncPills(page){
  document.querySelectorAll('[data-pill]').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-pill')===page);
  });
}
document.querySelectorAll('[data-pill]').forEach(function(btn){
  btn.addEventListener('click',function(){
    var page=btn.getAttribute('data-pill');
    go(page);
    syncPills(page);
  });
});
// Patch go() to also sync pills
var _origGo3=go;
go=function(p,extra){
  _origGo3(p,extra);
  syncPills(p);
};

// ── INIT ─────────────────────────────────────────────────────────────
setSv('saved');
rNav();
(function(){
  var cb='cb'+Date.now();
  var sc=document.createElement('script');
  var done=false;
  var t=setTimeout(function(){if(!done){done=true;setSv('saved');R();}},6000);
  window[cb]=function(res){
    if(done)return;done=true;clearTimeout(t);
    var hadData=false;
    try{
      if(res&&res.success&&res.data){
        Object.keys(res.data).forEach(function(k){
          if(res.data[k]&&Array.isArray(res.data[k])&&res.data[k].length>0){D[k]=res.data[k];hadData=true;}
        });
      }
    }catch(e){}
    if(!hadData)fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'batchUpdate',data:D})}).catch(function(){});
    setSv('saved');R();
    delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);
  };
  sc.onerror=function(){if(!done){done=true;setSv('saved');R();}};
  sc.src=API+'?callback='+cb;
  document.head.appendChild(sc);
})();
</script>
